<body>
  <div class="contact-page">
    <h1>Contáctanos</h1>
    <form id="contactForm" onsubmit="return handleSubmit(event)">
      <!-- Nombre - obligatorio -->
      <label for="nombre">Nombre y Apellido</label>
      <input id="nombre" name="nombre" type="text" required placeholder="Escribir nombre y Apellido" />

      <!-- Teléfono  – obligatorio -->
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" required placeholder="Escribir número " />

      <div class="row">
        <!-- Email - normal -->
        <div class="col">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="ejemplo@correo.com" />
        </div>
        <!-- Edad - normal -->
        <div class="col">
          <label for="cantidad">Edad</label>
          <input id="cantidad" name="cantidad" type="number" min="0" placeholder="Ingrese edad" />
        </div>
      </div>

      <!-- Checkbox - normal -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="newsletter" name="newsletter" />
          Deseo añadir alguna descripción?
        </label>
      </div>

      <!-- Descripcion - opcional -->
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" maxlength="500"></textarea>

      <div class="actions">
        <button type="submit" class="primary">Enviar</button>
        <button type="button" class="secondary" onclick="document.getElementById('contactForm').reset()">Cancelar</button>
      </div>
    </form>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const nombre = form.nombre.value.trim();
      const telefono = form.telefono.value.trim();
      // Validaciones  adicionales - opcional
      if (!nombre) {
        alert('Por favor ingresa tu nombre.');
        form.nombre.focus();
        return false;
      }
      if (!telefono) {
        alert('Por favor ingresa tu teléfono.');
        form.telefono.focus();
        return false;
      }
      alert('Gracias, ' + nombre + '. Hemos recibido tu mensaje.');
      form.reset();
      return false;
    }
  </script>
